# ===============================
# Production profile - PostgreSQL
# Configure the following via environment variables (never commit real credentials):
#   DB_URL, DB_USERNAME, DB_PASSWORD
# ===============================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/blogdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:blogapi_user}
spring.datasource.password=${DB_PASSWORD:changeme}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Use "validate" once schema is managed by migrations (Flyway/Liquibase); "update" is safe for first bootstrap only.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=false

logging.level.com.blogapi=INFO
logging.level.org.hibernate.SQL=WARN
